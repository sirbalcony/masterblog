<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Welcome to My Flask Blog!</h1>

    <div class="add-post-container">
        <a class="add-button" href="{{ url_for('add') }}">
            Add New Post
        </a>
    </div>

    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p><em>Written by {{ post.author }}</em></p>
            <p>{{ post.content }}</p>

            <a class="like-button" href="{{ url_for('like', post_id=post.id) }}">Like ({{ post.likes }})</a>
            <a class="edit-button" href="{{ url_for('update', post_id=post.id) }}">Edit</a>
            <a class="delete-button" href="{{ url_for('delete', post_id=post.id) }}">Delete</a>
        </div>
    {% endfor %}

</body>
</html>
